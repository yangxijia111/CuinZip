name: Build Binaries

# 完整构建矩阵(Debug+Release × x64+arm64 + MSIX bundle + 打包 + 安装器)。
# 成本高,仅在 main、版本 tag 与手动触发时运行;日常 PR/push 的基本构建回归
# 由 cuinzip-ci.yml(x64 Release + smoke tests)承担。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - uses: microsoft/setup-msbuild@v3
    - name: Clear local NuGet cache (workaround for failed restores on windows-latest)
      run: dotnet nuget locals all --clear
    - name: Build
      run: MSBuild -binaryLogger:Output\BuildAllTargets.binlog -m BuildAllTargets.proj
    - name: Upload MSIX Bundle
      uses: actions/upload-artifact@v7
      with:
        name: CuinZip_Mainline_ApplicationPackages
        path: Output/Binaries/AppPackages
    - name: Upload Portable Binaries ZIP
      uses: actions/upload-artifact@v7
      with:
        name: CuinZip_Mainline_PortableZip
        path: Output/CuinZip_*_x64_Portable.zip
    - name: Upload Installer
      uses: actions/upload-artifact@v7
      with:
        name: CuinZip_Mainline_Installer
        path: Output/CuinZip_*_x64_Setup.exe
    - name: Upload MSBuild Build Process Binary Log
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: CuinZip_Mainline_BuildBinaryLog
        path: Output/BuildAllTargets.binlog
    - name: Upload Upstream Binaries Set
      uses: actions/upload-artifact@v7
      with:
        name: CuinZip_Mainline_UpstreamBinaries
        path: Output/Binaries/Root/Binaries
    - name: Upload Debug Symbols
      uses: actions/upload-artifact@v7
      with:
        name: CuinZip_Mainline_DebugSymbols
        path: Output/Binaries/Root/Symbols
